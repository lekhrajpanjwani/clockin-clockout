name: Database backup

# Weekly encrypted backup of the Supabase database (roles, schema, data —
# including auth users) using the Supabase CLI. The dump is encrypted with a
# passphrase before upload, because artifacts of a public repository can be
# downloaded by anyone signed in to GitHub. Restore steps: docs/operations.md.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL     Session-pooler connection string (port 5432), e.g.
#                       postgresql://postgres.<ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres
#   BACKUP_PASSPHRASE   Long random passphrase; store it in your password manager.

on:
  schedule:
    - cron: "30 20 * * 0" # Sundays 20:30 UTC = Mondays 02:00 IST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::warning::Backup skipped — set the SUPABASE_DB_URL and BACKUP_PASSPHRASE repository secrets (see docs/operations.md)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v3
        if: steps.config.outputs.enabled == 'true'
        with:
          version: latest

      - name: Dump roles, schema and data
        if: steps.config.outputs.enabled == 'true'
        run: |
          mkdir backup
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/roles.sql --role-only
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/data.sql --use-copy --data-only
          ls -la backup

      - name: Encrypt
        if: steps.config.outputs.enabled == 'true'
        run: |
          stamp=$(date -u +%Y-%m-%d)
          tar -czf - backup | gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$BACKUP_PASSPHRASE" --symmetric --cipher-algo AES256 \
            -o "punchcard-db-$stamp.tar.gz.gpg"
          rm -rf backup
          echo "STAMP=$stamp" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        if: steps.config.outputs.enabled == 'true'
        with:
          name: punchcard-db-${{ env.STAMP }}
          path: punchcard-db-*.tar.gz.gpg
          retention-days: 90
          if-no-files-found: error
